<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Snuff Bar | Admin</title>

  <style>
    :root{
      --bg:#321507;
      --fg:#F6C96B;
      --panel:#2a1106;
      --border:rgba(246,201,107,.35);
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
    }

    .wrap{
      max-width: 720px;
      margin: 0 auto;
      padding: 18px;
      box-sizing: border-box;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      background:var(--panel);
      border:1px solid var(--border);
      box-sizing:border-box;
    }

    .topbar .meta{
      font-size:14px;
      line-height:1.5;
    }

    .btn{
      background:transparent;
      color:var(--fg);
      border:1px solid var(--border);
      padding:10px 12px;
      cursor:pointer;
      font-size:14px;
    }

    h2{
      margin:18px 0 10px;
      letter-spacing:.08em;
    }

    .panel{
      padding:14px;
      background:var(--panel);
      border:1px solid var(--border);
      box-sizing:border-box;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:10px;
    }

    label{
      font-size:14px;
      opacity:.95;
    }

    input, textarea{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--fg);
      outline:none;
      border-radius:0; /* square */
      font-size:16px;
    }

    textarea{ min-height: 110px; resize: vertical; }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .row .col{
      flex:1 1 200px;
      min-width:200px;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 8px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .item{
      padding:12px;
      border:1px solid var(--border);
      background:transparent;
    }

    .item .title{
      font-weight:700;
      margin-bottom:6px;
    }

    .item .line{
      font-size:14px;
      line-height:1.45;
      opacity:.98;
    }

    .item .item-actions{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .muted{ opacity:.75; }
    .hidden{ display:none; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="meta">
        <div><strong>Logged in:</strong> <span id="who" class="muted">—</span></div>
        <div><strong>Auto logoff:</strong> <span id="countdown" class="muted">—</span></div>
        <div id="status" class="muted"></div>
      </div>
      <button id="btnLogout" class="btn">Logoff</button>
    </div>

    <h2>EVENTS</h2>

    <div class="panel">
      <div id="eventsList" class="list"></div>
      <div id="emptyList" class="muted hidden">No live events found.</div>
    </div>

    <h2>ADD / EDIT</h2>

    <div class="panel">
      <div class="row">
        <div class="col field">
          <label for="date">Date</label>
          <input id="date" type="date" />
        </div>
        <div class="col field">
          <label for="time">Time</label>
          <input id="time" type="time" />
        </div>
      </div>

      <div class="field">
        <label for="price">Price</label>
        <input id="price" type="text" placeholder="Optional" />
      </div>

      <div class="field">
        <label for="desc">Description</label>
        <textarea id="desc" placeholder="Optional"></textarea>
      </div>

      <div class="actions">
        <button id="btnSave" class="btn">Save</button>
        <button id="btnCancel" class="btn">Cancel edit</button>
      </div>

      <div id="formNote" class="muted" style="margin-top:10px;"></div>
    </div>
  </div>

  
 
</body>
</html>
