<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Snuff Bar | Kendal</title>

  <link rel="icon" type="image/png" href="assets/images/TheSnuffBarFavicon.png">

  <style>
    body{
      margin:0;
      padding:0;
    }

    .site-header{
      width:100vw;
    }

    .site-header img{
      display:block;
      width:100%;
      height:20vh;
      object-fit: cover;
      object-position: center;
    }

    .brand-mark{
  position: fixed;
  left: 50px;
  top: 50px;
  width: 280px;
  height: 280px;
  z-index: 9999;
}

.brand-mark img{
  width: 100%;
  height: 100%;
  display: block;
}

.hero-image{
  display: block;
  width: 100%;
  height: auto;
}

      @media (max-width: 1366px){
  .site-header{
    height: 15vh;
    overflow: hidden;
  }

  .site-header img{
      display:block;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;

  }

  .brand-mark{
    left: 50%;
    top: 20vh;
    width: 380px;
    height: 380px;
    transform: translate(-50%, -50%);
  }
      
  .hero-image{
    width: 100%;
    height: 50vh;
    object-fit: cover;
    object-position: center;
  }
    }
    

       @media (max-width: 1100px){
  .site-header{
    height: 15vh;
    overflow: hidden;
  }

  .site-header img{
      display:block;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;

  }

  .brand-mark{
    left: 50%;
    top: 20vh;
    width: 380px;
    height: 380px;
    transform: translate(-50%, -50%);
  }
      
  .hero-image{
    width: 100%;
    height: 60vh;
    object-fit: cover;
    object-position: center;
  }
    }

    @media (max-width: 600px){
  .site-header{
    height: 15vh;
    overflow: hidden;
  }

  .site-header img{
      display:block;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
  }

  .brand-mark{
    left: 50%;
    top: 20vh;
    width: 240px;
    height: 240px;
    transform: translate(-50%, -50%);
  }
      
  .hero-image{
    width: 100%;
    height: 40vh;
    object-fit: cover;
    object-position: center;
  }
    }

@media (min-width: 901px) and (max-width: 1366px) and (orientation: landscape){
  .site-header{
    height: 20vh;
    overflow: hidden;
  }

  .site-header img{
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .brand-mark{
    top: 30vh;  
  }

  .hero-image{
    height: 60vh;  
    object-fit: cover;
    object-position: center; 
  }
}
    
  </style>
</head>

  
<body>

  <header class="site-header">
    <img src="assets/images/TheSnuffBarHeader.png" alt="The Snuff Bar">
    
  <div class="brand-mark">
  <img src="assets/images/TheSnuffBarLogo.png" alt="The Snuff Bar">
</div> 
    
    </header>
  
<img class="hero-image" src="assets/images/TheSnuffBarHero.png" alt="The Snuff Bar">



</body>
</html>
