<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Snuff Bar | Kendal</title>

<style>

  /* ---------- RESET ---------- */
*,
*::before,
*::after{ box-sizing:border-box; }

body{
  margin:0;
  background:#000;
}

/* ---------- HEADER ---------- */
.site-header{
  position: relative;
  width: 100%;
  height: clamp(170px, 28vw, 260px);  /* desktop-first, stable */
  overflow: hidden;
}

/* TOP SECTION (horizontal needle lines) */
.header-top{
  height: calc(100% - 20px);
  background:
    repeating-linear-gradient(
      0deg,               /* 0deg = horizontal lines */
      #E1AD48 0px,
      #E1AD48 1px,
      #F6C96B 1px,
      #F6C96B 7px
    );
}

/* BOTTOM SECTION (20px band, horizontal needle lines) */
.header-bottom{
  height: 20px;
  background:
    repeating-linear-gradient(
      0deg,               /* horizontal lines */
      #A81A16 0px,
      #A81A16 1px,
      #321507 1px,
      #321507 7px
    );
}

/* ---------- LOGO ---------- */
.brand-mark{
  position:absolute;
  left:50%;
  top: calc(100% - 20px);            /* sits on the join */
  transform: translate(-50%, -50%);
  width: clamp(190px, 24vw, 360px);
  aspect-ratio: 1 / 1;
  z-index: 10;
  pointer-events: none;
}

.brand-mark img{
  width:100%;
  height:100%;
  display:block;
}

/* ---------- HERO ---------- */
.hero img{
  display:block;
  width:100%;
  height:auto;
}


/* ---------- FUTURE MOBILE HOOK ---------- */
/*
@media (max-width: 600px){
  .site-header{
    aspect-ratio: 4 / 3;
  }
}
*/

</style>
</head>

<body>

<header class="site-header">
  <div class="header-top"></div>
  <div class="header-bottom"></div>

  <div class="brand-mark">
    <img src="assets/images/TheSnuffBarLogo.png" alt="The Snuff Bar">
  </div>
</header>

<section class="hero">
  <img src="assets/images/TheSnuffBarHero.png" alt="The Snuff Bar">
</section>

</body>
</html>
