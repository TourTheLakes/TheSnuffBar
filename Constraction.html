<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Snuff Bar | Kendal</title>

  <link rel="icon" type="image/png" href="assets/images/TheSnuffBarFavicon.png">

  <style>
    body{
      margin:0;
      padding:0;
    }

    .site-header{
      width:100vw;
    }

    .site-header img{
      display:block;
      width:100%;
      height:auto;
    }

    .brand-mark{
  position: fixed;
  left: 50px;
  top: 50px;
  width: 280px;
  height: 280px;
  z-index: 9999;
}

.brand-mark img{
  width: 100%;
  height: 100%;
  display: block;
}

    @media (max-width: 700px){
  .site-header{
    height: 60vh;
    overflow: hidden;
  }

  .site-header img{
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .brand-mark{
    left: 50%;
    top: 20vh;
    width: 220px;
    height: 220px;
    transform: translate(-50%, -50%);
  }
    }
  </style>
</head>

  
<body>

  <header class="site-header">
    <img src="assets/images/TheSnuffBarHeader.png" alt="The Snuff Bar">
    
<div class="brand-mark">
  <img src="assets/images/TheSnuffBarLogo.png" alt="The Snuff Bar">
</div>


    
  </header>

</body>
</html>
