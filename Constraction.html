<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Snuff Bar | Kendal</title>

<style>

/* ---------- RESET ---------- */
*,
*::before,
*::after{
  box-sizing: border-box;
}

body{
  margin: 0;
  background: #000;
}

/* ---------- HEADER ---------- */

.site-header{
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 5; /* laptop-perfect starting point */
  overflow: hidden;
}

/* TOP SECTION */
.header-top{
  height: 70%;
  background:
    repeating-linear-gradient(
      90deg,
      #E1AD48 0px,
      #E1AD48 1px,
      #F6C96B 1px,
      #F6C96B 6px
    );
}

/* BOTTOM SECTION */
.header-bottom{
  height: 30%;
  background:
    repeating-linear-gradient(
      90deg,
      #A81A16 0px,
      #A81A16 1px,
      #321507 1px,
      #321507 6px
    );
}

/* ---------- LOGO ---------- */

.brand-mark{
  position: absolute;
  left: 50%;
  top: 70%; /* sits across the join */
  transform: translate(-50%, -50%);
  width: clamp(220px, 22vw, 380px);
  aspect-ratio: 1 / 1;
  z-index: 10;
}

.brand-mark img{
  width: 100%;
  height: 100%;
  display: block;
}

/* ---------- HERO ---------- */

.hero{
  width: 100%;
}

.hero img{
  display: block;
  width: 100%;
  height: auto;
}

/* ---------- FUTURE MOBILE HOOK ---------- */
/*
@media (max-width: 600px){
  .site-header{
    aspect-ratio: 4 / 3;
  }
}
*/

</style>
</head>

<body>

<header class="site-header">
  <div class="header-top"></div>
  <div class="header-bottom"></div>

  <div class="brand-mark">
    <img src="assets/images/TheSnuffBarLogo.png" alt="The Snuff Bar">
  </div>
</header>

<section class="hero">
  <img src="assets/images/TheSnuffBarHero.png" alt="The Snuff Bar">
</section>

</body>
</html>
