<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Snuff Bar | Kendal</title>

  <link rel="icon" type="image/png" href="assets/images/TheSnuffBarFavicon.png">

  <style>

    body{
      margin:0;
      padding:0;
      padding-top: 20vh;
    }

    .site-header{
      position: fixed;
      top: 0;
      left: 0;
      width:100vw;
      height: 20vh;
      overflow: hidden;
      z-index: 9998;
    }

    .site-header img{
      display:block;
      width:100%;
      height:100%;
      object-fit: cover;
      object-position: center;
    }

    .brand-mark{
  position: fixed;
  left: 50px;
  top: 50px;
  width: 280px;
  height: 280px;
  z-index: 9999;
}

.brand-mark img{
  width: 100%;
  height: 100%;
  display: block;
}

.hero-wrap{
  position: relative;
}

.hero-image{
  display:block;
  width:100%;
  height:auto;
}

.hero-fog{
  position:absolute;
  inset:0;
  background: rgba(255,255,255,0.45);
  pointer-events:none;
  z-index: 1;

  -webkit-mask-image: linear-gradient(#000,#000);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
}

.hero-etch{
  position:absolute;
  left:50%;
  top:50%;
  transform: translate(-50%, -50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 2rem;

  font-size: 4rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;


  color: rgba(255,255,255,0);
  text-shadow:
    0 2px 2px rgba(0,0,0,0.55),  
    0 -1px 1px rgba(255,255,255,0.85);

  mix-blend-mode: overlay;

  z-index: 2;
  pointer-events:none;
}
    
    @media (max-width: 1024px){
    body{
      padding-top: 15vh;
    }
      
  .site-header{
    height: 15vh;
    overflow: hidden;
  }

  .site-header img{
      display:block;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;

  }

  .brand-mark{
    left: 50%;
    top: 20vh;
    width: 380px;
    height: 380px;
    transform: translate(-50%, -50%);
  }
      
  .hero-image{
    width: 100%;
    height: 45vh;
    object-fit: cover;
    object-position: center;
  }
    }

      @media (max-width: 700px){
       body{
      padding-top: 20vh;
    }
        
  .site-header{
    height: 20vh;
    overflow: hidden;
  }

  .site-header img{
      display:block;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;

  }

  .brand-mark{
    left: 50%;
    top: 30vh;
    width: 340px;
    height: 340px;
    transform: translate(-50%, -50%);
  }
      
  .hero-image{
    width: 100%;
    height: 60vh;
    object-fit: cover;
    object-position: center;
  }
    }

    @media (max-width: 600px){
       body{
      padding-top: 15vh;
    }
      
  .site-header{
    height: 15vh;
    overflow: hidden;
  }

  .site-header img{
      display:block;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
  }

  .brand-mark{
    left: 50%;
    top: 20vh;
    width: 240px;
    height: 240px;
    transform: translate(-50%, -50%);
  }
      
  .hero-image{
    width: 100%;
    height: 40vh;
    object-fit: cover;
    object-position: center;
  }
    }
    
  </style>
</head>

  
<body>

  <header class="site-header">
    <img src="assets/images/TheSnuffBarHeader.png" alt="The Snuff Bar">
    
  <div class="brand-mark">
  <img src="assets/images/TheSnuffBarLogo.png" alt="The Snuff Bar">
</div> 
    
    </header>
  
<div class="hero-wrap">
  <img class="hero-image" src="assets/images/TheSnuffBarHero.png" alt="The Snuff Bar">
  
<div class="hero-etch">
  <span class="star">✦</span>
     <span class="word">WELCOME</span>
       <span class="star">✦</span>
  </div>
    </div>



</body>
</html>
