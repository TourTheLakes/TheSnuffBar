<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Snuff Bar | Kendal</title>

  <style>
    .site-header{
      width:100%;
      margin:0;
      padding:0;
    }

    .header-inner{
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:14px 18px;
    }

    .header-logo{
      display:block;
      width:100%;
      height:auto;
      max-width:980px;
      margin:0 auto;
    }

    @media (max-width:900px){
      .header-inner{ max-width:900px; padding:12px 16px; }
      .header-logo{ max-width:860px; }
    }

    @media (max-width:700px){
      .header-inner{ max-width:700px; padding:10px 14px; }
      .header-logo{ max-width:640px; }
    }

    @media (max-width:600px){
      .header-inner{ max-width:600px; padding:10px 12px; }
      .header-logo{ max-width:520px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <img
        class="header-logo"
        src="assets/images/TheSnuffBarHeader.png"
        alt="The Snuff Bar"
      >
    </div>
  </header>

</body>
</html>
