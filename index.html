<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Snuff Bar | Kendal</title>
</head>

<body style="margin:0; padding:0; background:#ffffff; color:#000000; font-family: Arial, Helvetica, sans-serif; line-height:1.6;">

  <!-- HERO -->
  <header style="
    padding:70px 20px 56px 20px;
    text-align:center;
  ">
    <img
      src="logo.png"
      alt="The Snuff Bar"
      style="max-width:360px; width:100%; height:auto; display:block; margin:0 auto 18px auto;"
    >

    <p style="margin:0; font-size:18px;">
      Our new website is coming soon.
    </p>

    <p style="margin:14px 0 0 0; font-size:15px;">
      Meanwhile, here are a few details about us.
    </p>
  </header>

  <!-- DETAILS (minimal “sections”, spacing only) -->
  <main style="max-width:900px; margin:0 auto; padding:0 20px 60px 20px;">

    <!-- Contact row -->
    <section style="padding:34px 0; text-align:center;">
      <div style="display:inline-block; text-align:left; min-width:260px; margin:0 18px 12px 18px;">
        <div style="font-size:12px; letter-spacing:0.14em; text-transform:uppercase; margin:0 0 8px 0;">
          Email
        </div>
        <div style="font-size:16px;">
          <a href="mailto:thesnuffbar@gmail.com" style="color:#000000; text-decoration:none;">
            thesnuffbar@gmail.com
          </a>
        </div>
      </div>

      <div style="display:inline-block; text-align:left; min-width:260px; margin:0 18px 12px 18px;">
        <div style="font-size:12px; letter-spacing:0.14em; text-transform:uppercase; margin:0 0 8px 0;">
          Phone
        </div>
        <div style="font-size:16px;">
          <a href="tel:07854115839" style="color:#000000; text-decoration:none;">
            07854 115839
          </a>
        </div>
      </div>
    </section>

    <!-- Opening hours -->
    <section style="padding:34px 0; text-align:center;">
      <div style="display:inline-block; text-align:left; max-width:520px;">
        <div style="font-size:12px; letter-spacing:0.14em; text-transform:uppercase; margin:0 0 8px 0;">
          Opening Hours
        </div>
        <div style="font-size:16px;">
          Monday – Friday: 5.30pm – 11pm<br>
          Saturday &amp; Sunday: 3pm – 11pm
        </div>
      </div>
    </section>

    <!-- Sign off -->
    <section style="padding:34px 0; text-align:center;">
      <p style="margin:0; font-size:18px;">
        Hope to see you soon!
      </p>
    </section>

  </main>

  <!-- FOOTER -->
  <footer style="text-align:center; padding:26px 20px; font-size:13px;">
    © The Snuff Bar
  </footer>

</body>
</html>
